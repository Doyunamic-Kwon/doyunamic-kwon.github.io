project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "posts/**/*.md"
    - "!templates/"
  resources:
    - assets/
    - .nojekyll
    - "!work/**"
    - "!outputs/**"
    - "!scripts/**"
    - "!tests/**"
    - "!templates/**"
    - "!posts/**/_obsidian-import.json"

lang: ko
date-format: "YYYY.MM.DD"

website:
  title: Doyunamic
  description: "Doyunamic의 논문 리뷰."
  site-url: https://doyunamic-kwon.github.io
  favicon: assets/favicon.svg
  open-graph: true
  twitter-card: true
  page-navigation: false
  navbar:
    title: "Doyunamic"
    background: light
    pinned: true
    collapse-below: md
  sidebar:
    style: floating
    search: false
    collapse-level: 3
    header: |
      <div class="sidebar-profile">
        <a class="author-name" href="/">Doyunamic</a>
        <a class="author-link" href="https://github.com/Doyunamic-Kwon">GitHub</a>
      </div>
    contents:
      - text: 전체 글
        href: reviews.qmd
      # BLOG-TREE-START
      # BLOG-TREE-END
  search:
    location: navbar
    type: overlay
  page-footer:
    border: false
    left: "© 2026 Doyunamic"
    right:
      - text: "RSS"
        href: reviews.xml

format:
  html:
    theme:
      - cosmo
      - styles/theme.scss
    css: styles/site.css
    grid:
      sidebar-width: 210px
      body-width: 850px
      margin-width: 160px
      gutter-width: 2rem
    toc: true
    toc-title: "이 글에서"
    toc-depth: 2
    anchor-sections: true
    smooth-scroll: true
    code-copy: true
    code-overflow: scroll
    highlight-style: github
    html-math-method: mathjax
    include-after-body: includes/site.html

execute:
  enabled: false

